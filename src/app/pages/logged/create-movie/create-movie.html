<div id="create-movie-container" class="container">
    <div class="logo">
        <img src="/img/logo.png" alt="logo" />
    </div>
    <div class="row justify-content-center">
        <div class="registration-box">
            <h1 class="mb-4">Cadastre seu filme aqui</h1>
            <form #movieForm="ngForm" (ngSubmit)="onSubmit(movieForm)">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text"
                            class="form-control custom-input"
                            placeholder="Nome do filme"
                            name="name"
                            [(ngModel)]="movie.name"
                            required
                        />
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text"
                            class="form-control custom-input"
                            placeholder="Descrição do filme"
                            name="description"
                            [(ngModel)]="movie.description"
                        />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="input-icon-wrapper">
                            <input type="date"
                                class="form-control custom-input"
                                placeholder="Data de lançamento"
                                name="releaseDate"
                                [(ngModel)]="movie.releaseDate"
                            />
                            <i class="bi bi-calendar3 input-icon"></i>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="input-icon-wrapper">
                            <input type="number"
                                class="form-control custom-input"
                                placeholder="Avaliação geral"
                                name="rating"
                                min="0"
                                max="10"
                                step="0.1"
                                [(ngModel)]="movie.rating"
                            />
                            <i class="bi bi-star input-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <select class="form-select custom-input"
                            name="platform"
                            [(ngModel)]="movie.platform"
                        >
                            <option value="" selected disabled>Aonde está disponível?</option>
                            <option value="netflix">Netflix</option>
                            <option value="prime">Prime Video</option>
                            <option value="disney">Disney+</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <select class="form-select custom-input"
                            name="category"
                            [(ngModel)]="movie.category"
                        >
                            <option value="" selected disabled>Qual categoria</option>
                            <option value="acao">Ação</option>
                            <option value="comedia">Comédia</option>
                            <option value="drama">Drama</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn w-100 custom-button mb-3">
                    Cadastrar filme
                </button>
                <a routerLink="/" class="btn w-100 btn-voltar">Voltar</a>
            </form>
        </div>
    </div>
</div>
