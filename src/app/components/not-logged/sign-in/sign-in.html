<div id="sign-in-container" class="container">
    <div class="row justify-content-center">
            <div class="login-box" p-4>  
                <h1 class="mb-4">Entre na sua Conta</h1>
                <form>
                    <div class="mb-3">
                        <input type="text"
                            class="form-control cusrom-input"
                            placeholder="Email oi numero de telefone"
                        />
                    </div>

                    <div class="mb-3">
                        <input type="password"
                            class="form-control cusrom-input"
                            placeholder="Senha"
                        />
                    </div>

                    <button type="submit" class="btn btn-primary w-100 custom-button mb-3">
                        Entrar na Conta
                    </button>
                
                    <div class="text-center mb-4">
                        <a href="/esqueci-senha" class="text-white text-decoration-none forgot-password">
                            Esqueceu sua senha?
                        </a>
                    </div>

                   <div class="text-center new-here">
                        <span class="text-white">Novo por aqui? </span>
                        <a href="/cadastre-se" class="text-danger text-decoration-none ms-2">
                            Assine agora
                        </a>           
                   </div>
                </form>
            </div>
    </div>
</div>
