<div id="forgot-password-container" class="container">
    <div class="row justify-content-center">
            <div class="chance-password-box" p-4>  
                <h1 class="mb-4">Trocar senha</h1>
                <form>
                    <div class="mb-3">
                        <input type="text"
                            class="form-control cusrom-input"
                            placeholder="E-mail"
                        />
                    </div>

                    <div class="mb-3">
                        <input type="password"
                            class="form-control cusrom-input"
                            placeholder="Nova senha"
                        />
                    </div>

                    <div class="mb-3">
                        <input type="password"
                            class="form-control cusrom-input"
                            placeholder="Confirmar senha"
                        />
                    </div>

                    <button type="submit" class="btn btn-primary w-100 custom-button mb-3">
                        Confirmar alteração
                    </button>

                   <div class="text-center new-here">
                        <span class="text-white"> Já tem sua conta? </span>
                        <a href="/login" class="text-danger text-decoration-none ms-2">
                            Faça login
                        </a>           
                   </div>
                </form>
            </div>
    </div>
</div>
