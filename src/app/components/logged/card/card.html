<div class="movie-card">
    <div class="top-tag" *ngIf="isTop10">
        <span class="top-label">TOP</span>
        <span class="top-number">10</span>
    </div>

    <div class="card-content">
        <h2 class="movie-title">{{ title }}</h2>

        <p class="movie-description">
            {{ description }}
        </p>

        <div class="movie-info">
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span class="duration">
                    <span class="info-emoji">⏱️</span>{{ duration }}
                </span>

                <span class="age-rating">
                    <span class="age-emoji">🔞</span>{{ ageRating }}
                </span>

                <div class="rating" [ngClass]="getRatingClass()">
                    <span class="info-emoji">👍</span>
                    {{ approvalRating }}% Aprovação
                </div>
            </div>

            <div class="provider mt-2">
                <div class="provider-logo" [style.background-image]="'url(' + providerLogo + ')'"></div>
            </div>
        </div>
    </div>
</div>
